  <!-- Spirit: the haras' assistant -->
  <div class="spirit" data-state="closed">
    <button class="spirit__toggle" type="button" aria-expanded="false" aria-controls="spirit-panel" data-cursor="hover">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 27c0-6 1-9 4-12l-3-2c1-3 4-6 8-7l1-3 2 3c4 1 6 5 6 9 0 2-1 3-3 3l-3-2c-2 2-3 5-3 11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="19.5" cy="9.5" r="1" fill="currentColor"/></svg>
      <span>Spirit</span>
    </button>
    <section class="spirit__panel" id="spirit-panel" aria-label="Spirit" hidden>
      <header class="spirit__head">
        <div>
          <p class="spirit__name">Spirit</p>
          <p class="spirit__role" data-en="La Alhambra's assistant">Asistente de La Alhambra</p>
        </div>
        <button class="spirit__close" type="button" aria-label="Cerrar">×</button>
      </header>
      <div class="spirit__log" aria-live="polite">
        <p class="spirit__msg spirit__msg--bot" data-en="Hello, I'm Spirit. Ask me about our horses, riding lessons, rates, events or how to visit the haras.">Hola, soy Spirit. Pregúnteme por nuestros caballos, las clases, las tarifas, los eventos o cómo visitar el haras.</p>
      </div>
      <div class="spirit__chips">
        <button type="button" data-en="Lesson prices">Precios de clases</button>
        <button type="button" data-en="Boarding my horse">Pensión para mi caballo</button>
        <button type="button" data-en="Private events">Eventos privados</button>
      </div>
      <form class="spirit__form">
        <input name="q" type="text" autocomplete="off" maxlength="600" placeholder="Escriba su pregunta…" data-en-placeholder="Type your question…" aria-label="Mensaje" />
        <button type="submit" aria-label="Enviar">→</button>
      </form>
    </section>
  </div>
